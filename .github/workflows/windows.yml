name: Windows checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax, dependency, license, original files and secret patterns
        run: npm.cmd run check:source
      - name: Unit, mock protocol, integration and security tests
        run: npm.cmd test
      - name: Local bridge soak
        run: npm.cmd run test:soak
      - name: Build and verify reproducible archive
        run: npm.cmd run test:windows
